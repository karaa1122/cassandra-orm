services:
  cassandra:
    image: cassandra:5.0
    ports:
      - '127.0.0.1:9042:9042'
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ['CMD', 'cqlsh', '-e', 'DESCRIBE KEYSPACES']
      interval: 10s
      timeout: 10s
      retries: 20

  # Creates the keyspace once Cassandra accepts connections.
  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint:
      - cqlsh
      - cassandra
      - -e
      - "CREATE KEYSPACE IF NOT EXISTS chat WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}"
    restart: 'no'
